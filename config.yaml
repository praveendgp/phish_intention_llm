# =====================================================================
# PhishIntentionLLM - Central Configuration
# =====================================================================

project:
  name: PhishIntentionLLM
  tagline: "Uncovering Phishing Website Intentions through Multi-Agent RAG"
  version: "2.0.0"

# ---------------------------------------------------------------------
# Ollama runtime
# ---------------------------------------------------------------------
ollama:
  host: "http://localhost:11434"
  request_timeout: 300
  keep_alive: "2m"
  num_ctx: 8192
  max_retries: 3
  retry_backoff: 2.0
  num_predict: 1024
  repeat_penalty: 1.15
  repeat_last_n: 256
  disable_json_format_for: ["minicpm-v", "moondream"]

# ---------------------------------------------------------------------
# MODELS
# ---------------------------------------------------------------------
models:
  # ---------- A) MANIFEST STAGE ----------
  annotator_a:
    model: "minicpm-v:8b"
    vision: true
    temperature: 0.1
    top_p: 0.9
    label: "Annotator-A (MiniCPM-V)"

  annotator_b:
    model: "gemma3:12b"
    vision: true
    temperature: 0.2
    top_p: 0.9
    label: "Annotator-B (Gemma-3)"
    num_ctx: 12288

  manifest_tiebreaker:
    model: "mistral-small3.2:24b"
    vision: true
    temperature: 0.0
    top_p: 0.9
    label: "Manifest Tie-Breaker (Mistral-Small-3.2)"

  manifest_finalizer:
    model: "mistral-small3.2:24b"
    vision: true
    temperature: 0.0
    top_p: 0.9
    label: "Manifest Finalizer (Mistral-Small-3.2)"

  # ---------- B) FRAMEWORK STAGE (5 layers) ----------
  vision:
    model: "minicpm-v:8b"
    vision: true
    temperature: 0.1
    json_format: false
    num_predict: 768

  context:
    model: "gemma3:12b"
    vision: true
    temperature: 0.0
    top_p: 0.9
    label: "Context Layer (Gemma-3)"

  classifier:
    model: "gemma3:12b"
    vision: true
    temperature: 0.0
    top_p: 0.9
    label: "Classification Layer (Gemma-3)"

  specialist:
    model: "gemma3:12b"
    vision: true
    temperature: 0.0
    top_p: 0.9
    label: "Specialist Layer (Gemma-3)"

  validator:
    model: "mistral-small3.2:24b"
    vision: true
    temperature: 0.0
    top_p: 0.9
    label: "Validation Layer (Mistral-Small-3.2)"

framework:
  confidence_threshold: 0.80
  top_k_categories: 3
  min_categories: 1
  enable_feedback_loop: true
  enable_rag: true
  retrieval_top_k: 4
  max_image_edge: 896
  vision_for_all_agents: true

manifest:
  agreement_margin: 0.15
  enable_tiebreaker: true
  enable_finalizer: true
  min_confidence: 0.35
  max_intentions: 3
  flag_for_review_when: ["conflict", "tie-break applied", "low confidence"]

categories:
  - "Credential Theft"
  - "Financial Fraud"
  - "Malware Distribution"
  - "Personal Information Harvesting"

sectors:
  - financial
  - e-commerce
  - social networking
  - telecommunications
  - email provider
  - online/cloud service
  - delivery & couriers
  - government
  - gaming
  - insurance
  - internet service
  - payment services
  - cryptocurrency
  - transportation
  - other

datasets:
  root: "./data/raw"
  putra:
    enabled: true
    path: "./data/raw/putra"
    labels: ["phishing", "not-phishing"]
    screenshot_dir: "screenshots"
    asset_dir: "assets"
    phishing_only: true
  phishiris:
    enabled: true
    path: "./data/raw/phishIris"
    splits: ["train", "val"]
    brand_is_directory: true

storage:
  results_dir: "./data/outputs/results"
  manifest: "./data/outputs/manifest.jsonl"
  manifest_runs_dir: "./data/outputs/manifest_runs"
  predictions: "./data/outputs/predictions.jsonl"
  manual_annotations: "./data/outputs/manual_annotations.jsonl"
  ground_truth: "./data/outputs/ground_truth.jsonl"
  runs_dir: "./data/outputs/runs"
  kb_dir: "./data/knowledge_base"

manual_annotation:
  enabled: true
  annotators: ["engineer_1", "engineer_2", "reviewer"]
  require_reviewer: true
  allow_multi_intention: true
  max_intentions_per_sample: 4

evaluation:
  reference: "manifest"
  complexity_thresholds: {1: 1, 2: 1, 3: 2}
  train_test_split: 0.9
  random_seed: 42

ui:
  theme: "dark"
  page_title: "PhishIntentionLLM"
  show_agent_trace: true
  show_raw_json: true

# ---------------------------------------------------------------------
# Subscription & Role-Based Access Control
# ---------------------------------------------------------------------
subscription:
  enabled: true
  plans:
    free:
      name: "Free Community Tier"
      can_upload: false
      can_execute_pipeline: false
      can_view_historical: true
    pro:
      name: "Pro Security Analyst"
      can_upload: true
      can_execute_pipeline: true
      can_view_historical: true
  accounts:
    "free_user":
      password: "password123"
      plan: "free"
    "pro_user":
      password: "pro123password"
      plan: "pro"